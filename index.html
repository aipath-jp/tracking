<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SalesX Tracking Dashboard</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: linear-gradient(135deg, #1e293b 0%, #334155 100%); min-height: 100vh; padding: 20px; color: #333; }
    .container { max-width: 1200px; margin: 0 auto; }
    .header-area { text-align: center; margin-bottom: 25px; }
    h1 { color: white; font-size: 26px; }
    .client-name-display { color: #38bdf8; font-size: 20px; font-weight: bold; display: block; margin-top: 5px; }

    .card { background: white; border-radius: 12px; padding: 25px; box-shadow: 0 10px 30px rgba(0,0,0,0.3); margin-bottom: 20px; }
    .settings { background: #fef3c7; padding: 15px; border-radius: 8px; margin-bottom: 20px; border: 1px solid #fcd34d; }
    .settings h3 { font-size: 14px; margin-bottom: 10px; color: #92400e; }

    input[type="text"], textarea { width: 100%; padding: 12px; border: 2px solid #e2e8f0; border-radius: 8px; font-size: 14px; margin-bottom: 10px; }
    .btn { display: inline-block; background: #2563eb; color: white; padding: 10px 18px; border: none; border-radius: 6px; font-weight: 600; cursor: pointer; transition: 0.2s; text-decoration: none; text-align: center; }
    .btn:hover:not(:disabled) { opacity: 0.9; transform: translateY(-1px); }
    .btn:disabled { background: #cbd5e1; cursor: not-allowed; opacity: 0.6; }
    
    .btn-import { background: #059669; }
    .btn-refresh { background: #7c3aed; flex: 2; }
    .btn-csv { background: #4b5563; margin-left: 10px; }
    .btn-danger-all { background: #dc2626; margin-left: 10px; font-size: 13px; }
    
    .status-btn { padding: 6px 12px; border-radius: 20px; border: none; cursor: pointer; font-weight: bold; font-size: 12px; width: 70px; }
    .status-unsent { background: #e2e8f0; color: #64748b; }
    .status-sent { background: #2563eb; color: white; }

    .action-bar { display: flex; margin-bottom: 15px; }
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 12px; text-align: left; border-bottom: 1px solid #e2e8f0; }
    th { background: #f8fafc; font-size: 12px; color: #64748b; }
    .count-badge { background: #dbeafe; color: #1e40af; padding: 4px 12px; border-radius: 999px; font-weight: bold; font-size: 18px; }
    
    .url-cell { font-family: monospace; font-size: 10px; color: #94a3b8; max-width: 60px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    
    /* 操作セルの並び */
    .action-cell { display: flex; align-items: center; gap: 6px; }
    .link-contact { background: #fef2f2; color: #b91c1c; border: 1px solid #fecaca; font-size: 11px; padding: 5px 10px; border-radius: 6px; text-decoration: none; font-weight: bold; white-space: nowrap; }
    .link-contact.disabled { opacity: 0.3; pointer-events: none; filter: grayscale(1); }
  </style>
</head>
<body>

<div class="container">
  <div class="header-area">
    <h1>🚀 SalesX Tracking Dashboard</h1>
    <div id="displayClientName" class="client-name-display">Meta-ADX</div>
  </div>

  <div class="card">
    <div class="settings">
      <h3>⚙️ 接続設定</h3>
      <label style="font-size: 10px; color: #92400e;">Worker URL</label>
      <input type="text" id="workerUrl" placeholder="https://your-worker.workers.dev">
      <button class="btn" onclick="saveSettings()">設定を保存</button>
    </div>

    <h2>📁 リスト登録</h2>
    <p style="font-size:12px; color:#666; margin-bottom:5px;">法人番号 / 会社名 / お問い合わせURL の順</p>
    <textarea id="importArea" rows="5" placeholder="2430001012288	XXX株式会社	https://example.com/contact"></textarea>
    <button class="btn btn-import" onclick="importData()">リストを一括登録する</button>
  </div>

  <div class="card">
    <div class="action-bar">
      <button class="btn btn-refresh" id="refreshBtn" onclick="loadCounts()">🔄 クリック数を一括更新</button>
      <button class="btn btn-csv" onclick="downloadCSV()">📥 CSV保存</button>
      <button class="btn btn-danger-all" onclick="deleteAllCompanies()">⚠️ 全削除</button>
    </div>
    
    <div style="overflow-x: auto;">
      <table>
        <thead>
          <tr>
            <th>会社名</th>
            <th style="width: 50px;">クリック</th>
            <th style="width: 80px;">配信用URL</th>
            <th>操作（送信・問合せ・コピー）</th>
            <th style="width: 60px;">管理</th>
          </tr>
        </thead>
        <tbody id="listBody"></tbody>
      </table>
    </div>
  </div>
</div>

<script>
  const DEFAULT_WORKER_URL = "https://meta-ad-x.aipathcorp.com";
  let companies = [];

  function init() {
    const savedUrl = localStorage.getItem('salesx_worker_url');
    document.getElementById('workerUrl').value = savedUrl || DEFAULT_WORKER_URL;
    const savedData = localStorage.getItem('salesx_companies_data');
    if (savedData) {
      companies = JSON.parse(savedData);
      renderTable();
    }
  }

  function saveSettings() {
    let url = document.getElementById('workerUrl').value.trim();
    if (url.endsWith('/')) url = url.slice(0, -1);
    localStorage.setItem('salesx_worker_url', url);
    alert('設定を保存しました');
    renderTable();
  }

  function importData() {
    const text = document.getElementById('importArea').value.trim();
    if (!text) return;
    const lines = text.split('\n');
    let addCount = 0;
    lines.forEach(line => {
      const parts = line.split('\t');
      if (parts.length >= 2) {
        const id = parts[0].trim();
        const name = parts[1].trim();
        const contactUrl = parts[3] ? parts[3].trim() : (parts[2] ? parts[2].trim() : '');
        if (!companies.find(c => c.id === id)) {
          companies.push({ id, name, contactUrl, count: 0, sent: 0, canSend: false });
          addCount++;
        }
      }
    });
    saveData();
    renderTable();
    document.getElementById('importArea').value = '';
    alert(`${addCount}件登録しました`);
  }

  async function loadCounts() {
    const btn = document.getElementById('refreshBtn');
    const workerUrl = document.getElementById('workerUrl').value;
    btn.disabled = true;
    btn.textContent = '同期中...';
    for (let company of companies) {
      try {
        const resp = await fetch(`${workerUrl}?action=getCount&id=${company.id}`);
        if (resp.ok) {
          const val = await resp.text();
          company.count = parseInt(val) || 0;
        }
      } catch (e) { console.error(e); }
    }
    saveData();
    renderTable();
    btn.disabled = false;
    btn.textContent = '🔄 クリック数を一括更新';
  }

  function renderTable() {
    const body = document.getElementById('listBody');
    const workerUrl = document.getElementById('workerUrl').value;
    body.innerHTML = '';

    companies.forEach((c, index) => {
      const trackingUrl = `${workerUrl}?id=${c.id}`;
      const isSent = c.sent === 1;

      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td><div style="font-weight:bold; font-size:13px;">${c.name}</div></td>
        <td><span class="count-badge">${c.count}</span></td>
        <td class="url-cell" title="${trackingUrl}">${trackingUrl}</td>
        <td class="action-cell">
          <button class="status-btn ${isSent ? 'status-sent' : 'status-unsent'}" 
            onclick="toggleStatus(${index})" 
            ${(!c.canSend || isSent) ? 'disabled' : ''}
            style="${(!c.canSend || isSent) ? 'opacity:0.5; cursor:not-allowed;' : ''}">
            ${isSent ? '完了' : '未送信'}
          </button>
          
          <a href="${c.contactUrl || '#'}" target="_blank" 
             class="link-contact ${!c.canSend ? 'disabled' : ''}">📩 お問合せ</a>
          
          <button class="btn" style="padding:5px 10px; font-size:11px;" onclick="copyText(this, '${trackingUrl}', ${index})">コピー</button>
        </td>
        <td>
          <button class="btn btn-danger-all" style="padding:5px 8px; margin:0; font-size:10px;" onclick="deleteItem(${index})">削除</button>
        </td>
      `;
      body.appendChild(tr);
    });
  }

  function toggleStatus(i) {
    if (companies[i].sent === 0) {
      companies[i].sent = 1;
      saveData();
      renderTable();
    }
  }

  function copyText(btn, t, index) {
    navigator.clipboard.writeText(t).then(() => {
      companies[index].canSend = true;
      saveData();
      const oldText = btn.textContent;
      btn.textContent = 'OK';
      setTimeout(() => { 
        btn.textContent = oldText; 
        renderTable();
      }, 500);
    });
  }

  function saveData() { localStorage.setItem('salesx_companies_data', JSON.stringify(companies)); }
  function deleteItem(i) {
    companies.splice(i, 1);
    saveData();
    renderTable();
}
  function deleteAllCompanies() { if(confirm('全削除しますか？')) { companies=[]; saveData(); renderTable(); } }

  function downloadCSV() {
    let csv = "\ufeffID,会社名,お問い合わせURL,ステータス,クリック数\n";
    companies.forEach(c => {
      csv += `"${c.id}","${c.name}","${c.contactUrl}","${c.sent?'送信済':'未送信'}",${c.count}\n`;
    });
    const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
    const link = document.createElement("a");
    link.href = URL.createObjectURL(blob);
    link.download = "tracking.csv";
    link.click();
  }

  init();
</script>
</body>
</html>
