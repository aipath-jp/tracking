<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>トラッキングURL管理 (法人番号・一括登録版)</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: linear-gradient(135deg, #1e3a8a 0%, #3b82f6 100%);
      min-height: 100vh; padding: 20px; color: #333;
    }
    .container { max-width: 1000px; margin: 0 auto; }
    h1 { color: white; text-align: center; margin-bottom: 20px; font-size: 28px; }
    .card {
      background: white; border-radius: 12px; padding: 25px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2); margin-bottom: 20px;
    }
    .settings { background: #fef3c7; padding: 15px; border-radius: 8px; margin-bottom: 20px; border: 1px solid #fcd34d; }
    .settings h3 { margin-bottom: 10px; color: #92400e; font-size: 15px; }
    input[type="text"], textarea {
      width: 100%; padding: 12px; border: 2px solid #e2e8f0; border-radius: 8px; font-size: 14px; margin-bottom: 10px;
    }
    textarea { height: 100px; font-family: monospace; resize: vertical; }
    .btn {
      display: inline-block; background: #2563eb; color: white; padding: 10px 20px;
      border: none; border-radius: 6px; font-weight: 600; cursor: pointer; transition: 0.2s;
    }
    .btn:hover { background: #1d4ed8; }
    .btn-import { background: #059669; }
    .btn-import:hover { background: #047857; }
    .btn-refresh { background: #7c3aed; width: 100%; margin-bottom: 15px; font-size: 16px; }
    .btn-delete { background: #ef4444; padding: 5px 10px; font-size: 12px; }
    .btn-copy { background: #64748b; padding: 5px 10px; font-size: 12px; }
    
    table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    th, td { padding: 12px; text-align: left; border-bottom: 1px solid #e2e8f0; }
    th { background: #f8fafc; font-size: 13px; color: #64748b; }
    .count-badge { background: #dbeafe; color: #1e40af; padding: 4px 12px; border-radius: 999px; font-weight: bold; }
    .url-cell { font-family: monospace; font-size: 11px; color: #666; max-width: 200px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .note { font-size: 12px; color: #666; margin-top: 5px; }
  </style>
</head>
<body>

<div class="container">
  <h1>🔗 SalesX トラッキング管理</h1>

  <div class="card">
    <div class="settings">
      <h3>⚙️ Worker接続設定</h3>
      <input type="text" id="workerUrl" placeholder="https://your-worker.workers.dev">
      <button class="btn" onclick="saveSettings()">設定を保存</button>
    </div>

    <h2>📁 スプシから一括登録</h2>
    <p class="note">スプレッドシートの「法人番号」と「会社名」の2列をコピーして下に貼り付けてください。</p>
    <textarea id="importArea" placeholder="1234567890123	株式会社サンプル&#10;9876543210987	有限会社テスト"></textarea>
    <button class="btn btn-import" onclick="importData()">リストを一括登録する</button>
  </div>

  <div class="card">
    <h2>📊 集計レポート</h2>
    <button class="btn btn-refresh" id="refreshBtn" onclick="loadCounts()">🔄 全件のカウントを更新</button>
    
    <div style="overflow-x: auto;">
      <table>
        <thead>
          <tr>
            <th>法人番号(ID)</th>
            <th>会社名</th>
            <th>クリック数</th>
            <th>配信用URL</th>
            <th>操作</th>
          </tr>
        </thead>
        <tbody id="listBody">
          </tbody>
      </table>
    </div>
  </div>
</div>

<script>
  let settings = { workerUrl: '' };
  let companies = []; // { id: '法人番号', name: '会社名', count: 0 }

  // 初期化
  function init() {
    const savedSettings = localStorage.getItem('track_settings_v2');
    if (savedSettings) {
      settings = JSON.parse(savedSettings);
      document.getElementById('workerUrl').value = settings.workerUrl;
    }
    const savedCompanies = localStorage.getItem('track_data_v2');
    if (savedCompanies) {
      companies = JSON.parse(savedCompanies);
      renderTable();
    }
  }

  function saveSettings() {
    let url = document.getElementById('workerUrl').value.trim();
    if (!url) return alert('Worker URLを入力してください');
    if (url.endsWith('/')) url = url.slice(0, -1);
    settings.workerUrl = url;
    localStorage.setItem('track_settings_v2', JSON.stringify(settings));
    alert('設定を保存しました');
    renderTable();
  }

  // スプシからの貼り付け処理
  function importData() {
    const text = document.getElementById('importArea').value.trim();
    if (!text) return alert('データを入力してください');

    const lines = text.split('\n');
    let addCount = 0;

    lines.forEach(line => {
      const parts = line.split('\t'); // タブ区切り
      if (parts.length >= 2) {
        const id = parts[0].trim();
        const name = parts[1].trim();
        
        // 重複チェック
        if (!companies.find(c => c.id === id)) {
          companies.push({ id, name, count: 0 });
          addCount++;
        }
      }
    });

    saveData();
    renderTable();
    document.getElementById('importArea').value = '';
    alert(`${addCount}件の新しく登録しました。`);
  }

  // Workerからカウントを取得
  async function loadCounts() {
    if (!settings.workerUrl) return alert('Worker設定を先に完了してください');
    if (companies.length === 0) return;

    const btn = document.getElementById('refreshBtn');
    btn.disabled = true;
    btn.textContent = '読み込み中...';

    for (let company of companies) {
      try {
        const resp = await fetch(`${settings.workerUrl}?action=getCount&id=${company.id}`);
        if (resp.ok) {
          const val = await resp.text();
          company.count = parseInt(val) || 0;
        }
      } catch (e) { console.error(e); }
    }

    saveData();
    renderTable();
    btn.disabled = false;
    btn.textContent = '🔄 全件のカウントを更新';
  }

  function renderTable() {
    const body = document.getElementById('listBody');
    body.innerHTML = '';

    companies.forEach((c, index) => {
      const trackingUrl = settings.workerUrl ? `${settings.workerUrl}?id=${c.id}` : 'URL未設定';
      
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td style="font-size:12px;">${c.id}</td>
        <td style="font-weight:bold;">${c.name}</td>
        <td><span class="count-badge">${c.count}</span></td>
        <td class="url-cell" title="${trackingUrl}">${trackingUrl}</td>
        <td>
          <button class="btn btn-copy" onclick="copyText('${trackingUrl}')">URLコピー</button>
          <button class="btn btn-delete" onclick="deleteItem(${index})">削除</button>
        </td>
      `;
      body.appendChild(tr);
    });
  }

  function saveData() {
    localStorage.setItem('track_data_v2', JSON.stringify(companies));
  }

  function deleteItem(index) {
    if (confirm('リストから削除しますか？')) {
      companies.splice(index, 1);
      saveData();
      renderTable();
    }
  }

  function copyText(text) {
    navigator.clipboard.writeText(text).then(() => alert('コピーしました'));
  }

  init();
</script>

</body>
</html>
