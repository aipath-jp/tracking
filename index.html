<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SalesX Tracking Dashboard</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: linear-gradient(135deg, #1e293b 0%, #334155 100%); min-height: 100vh; padding: 20px; color: #333; }
    .container { max-width: 1200px; margin: 0 auto; }
    
    .header-area { text-align: center; margin-bottom: 25px; }
    h1 { color: white; font-size: 26px; display: inline-block; vertical-align: middle; }
    .client-name-display { color: #38bdf8; font-size: 20px; font-weight: bold; display: block; margin-top: 5px; }

    .card { background: white; border-radius: 12px; padding: 25px; box-shadow: 0 10px 30px rgba(0,0,0,0.3); margin-bottom: 20px; }
    
    .settings { background: #fef3c7; padding: 15px; border-radius: 8px; margin-bottom: 20px; border: 1px solid #fcd34d; position: relative; }
    .settings h3 { font-size: 14px; margin-bottom: 10px; color: #92400e; }
    .id-badge { background: #fbbf24; color: #92400e; font-size: 11px; padding: 2px 8px; border-radius: 4px; font-weight: bold; margin-left: 5px; }

    input[type="text"], textarea { width: 100%; padding: 12px; border: 2px solid #e2e8f0; border-radius: 8px; font-size: 14px; margin-bottom: 10px; }
    
    .btn { display: inline-block; background: #2563eb; color: white; padding: 10px 18px; border: none; border-radius: 6px; font-weight: 600; cursor: pointer; transition: 0.2s; text-decoration: none; text-align: center; }
    .btn:hover { opacity: 0.9; transform: translateY(-1px); }
    .btn-import { background: #059669; }
    .btn-refresh { background: #7c3aed; flex: 2; }
    .btn-csv { background: #4b5563; margin-left: 10px; }
    .btn-danger-all { background: #dc2626; margin-left: 10px; font-size: 13px; }

    /* 会社URLボタンのデザイン改善 */
    .company-links { display: flex; gap: 6px; margin-top: 6px; }
    .link-tag { 
      font-size: 11px; 
      padding: 3px 8px; 
      border-radius: 4px; 
      text-decoration: none; 
      font-weight: bold; 
      display: flex; 
      align-items: center; 
      gap: 3px;
    }
    .link-hp { background: #e0f2fe; color: #0369a1; border: 1px solid #bae6fd; }
    .link-hp:hover { background: #bae6fd; }
    .link-contact { background: #fef2f2; color: #b91c1c; border: 1px solid #fecaca; }
    .link-contact:hover { background: #fecaca; }

    .action-bar { display: flex; margin-bottom: 15px; align-items: stretch; }
    .count-controls { display: flex; align-items: center; gap: 8px; }
    .btn-mini { padding: 4px 10px; font-size: 16px; border-radius: 4px; background: #64748b; color: white; border: none; cursor: pointer; }
    .sent-count { font-weight: bold; font-size: 18px; min-width: 30px; text-align: center; }
    
    table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    th, td { padding: 12px; text-align: left; border-bottom: 1px solid #e2e8f0; }
    th { background: #f8fafc; font-size: 12px; color: #64748b; }
    
    .count-badge { background: #dbeafe; color: #1e40af; padding: 4px 12px; border-radius: 999px; font-weight: bold; font-size: 18px; }
    .url-cell { font-family: monospace; font-size: 10px; color: #94a3b8; max-width: 150px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .btn-delete { background: #ef4444; padding: 5px 10px; font-size: 12px; }
    .btn-copy { background: #64748b; padding: 5px 10px; font-size: 12px; margin-right: 5px; }
  </style>
</head>
<body>

<div class="container">
  <div class="header-area">
    <h1>🚀 SalesX Tracking Dashboard</h1>
    <div id="displayClientName" class="client-name-display">Loading...</div>
  </div>

  <div class="card">
    <div class="settings">
      <h3>⚙️ 接続設定 <span id="idLabel" class="id-badge"></span></h3>
      <div style="display:flex; gap:10px;">
        <div style="flex: 2;">
          <label style="font-size: 10px; color: #92400e;">Worker URL</label>
          <input type="text" id="workerUrl">
        </div>
        <div style="flex: 1;">
          <label style="font-size: 10px; color: #92400e;">クライアントID</label>
          <input type="text" id="clientIdInput" readonly>
        </div>
      </div>
      <button class="btn" onclick="saveSettings()">設定を保存</button>
    </div>

    <h2>📁 スプシからリスト登録</h2>
    <p style="font-size:12px; color:#666; margin-bottom:5px;">法人番号 / 会社名 / HP / お問い合わせURL の4列を貼り付け</p>
    <textarea id="importArea" placeholder="2430001012288	ナトリ株式会社	http://...	http://.../contact"></textarea>
    <button class="btn btn-import" onclick="importData()">リストを一括登録する</button>
  </div>

  <div class="card">
    <div class="action-bar">
      <button class="btn btn-refresh" id="refreshBtn" onclick="loadCounts()">🔄 クリック数を一括更新</button>
      <button class="btn btn-csv" onclick="downloadCSV()">📥 CSVで保存</button>
      <button class="btn btn-danger-all" onclick="deleteAllCompanies()">⚠️ 全リスト削除</button>
    </div>
    
    <div style="overflow-x: auto;">
      <table>
        <thead>
          <tr>
            <th>会社名・宛先</th>
            <th>送信数</th>
            <th>クリック数</th>
            <th>配信用URL</th>
            <th>操作</th>
          </tr>
        </thead>
        <tbody id="listBody"></tbody>
      </table>
    </div>
  </div>
</div>

<script>
  // ==========================================
  const CLIENT_NAME = "Aipath"; 
  const CLIENT_ID   = "0";          
  const WORKER_URL  = "https://salesx.aipathcorp.com";

  let settings = { 
    workerUrl: WORKER_URL, 
    clientId: CLIENT_ID, 
    clientName: CLIENT_NAME 
  };
  let companies = [];

  function init() {
    document.getElementById('displayClientName').textContent = settings.clientName;
    document.getElementById('idLabel').textContent = `ID: ${settings.clientId}`;
    document.getElementById('workerUrl').value = settings.workerUrl;
    document.getElementById('clientIdInput').value = settings.clientId;

    const savedCompanies = localStorage.getItem(`track_data_${settings.clientId}`);
    if (savedCompanies) {
      companies = JSON.parse(savedCompanies);
      renderTable();
    }
  }

  function saveSettings() {
    let url = document.getElementById('workerUrl').value.trim();
    if (url.endsWith('/')) url = url.slice(0, -1);
    settings.workerUrl = url;
    localStorage.setItem(`track_settings_${settings.clientId}`, JSON.stringify(settings));
    alert('設定を保存しました');
    renderTable();
  }

  function importData() {
    const text = document.getElementById('importArea').value.trim();
    if (!text) return;
    const lines = text.split('\n');
    let addCount = 0;
    lines.forEach(line => {
      const parts = line.split('\t');
      if (parts.length >= 2) {
        const id = parts[0].trim();
        const name = parts[1].trim();
        const hpUrl = parts[2] ? parts[2].trim() : '';
        const contactUrl = parts[3] ? parts[3].trim() : '';
        if (!companies.find(c => c.id === id)) {
          companies.push({ id, name, hpUrl, contactUrl, count: 0, sent: 0 });
          addCount++;
        }
      }
    });
    saveData();
    renderTable();
    document.getElementById('importArea').value = '';
    alert(`${addCount}件登録しました`);
  }

  async function loadCounts() {
    const btn = document.getElementById('refreshBtn');
    btn.disabled = true;
    btn.textContent = '同期中...';
    for (let company of companies) {
      try {
        const resp = await fetch(`${settings.workerUrl}?action=getCount&id=${company.id}&C=${settings.clientId}`);
        if (resp.ok) company.count = parseInt(await resp.text()) || 0;
      } catch (e) { console.error(e); }
    }
    saveData();
    renderTable();
    btn.disabled = false;
    btn.textContent = '🔄 クリック数を一括更新';
  }

  function renderTable() {
    const body = document.getElementById('listBody');
    body.innerHTML = '';
    companies.forEach((c, index) => {
      const trackingUrl = `${settings.workerUrl}?id=${c.id}&C=${settings.clientId}`;
      
      // ボタン形式のURLリンク作成
      let linkHtml = '<div class="company-links">';
      if (c.hpUrl) linkHtml += `<a href="${c.hpUrl}" target="_blank" class="link-tag link-hp"><span>問い合わせURL</a>`;
      if (c.contactUrl) linkHtml += `<a href="${c.contactUrl}" target="_blank" class="link-tag link-contact"><span>📩</span> お問合せ</a>`;
      linkHtml += '</div>';

      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td>
          <div style="font-weight:bold; font-size:15px;">${c.name}</div>
          ${linkHtml}
          <div style="font-size:10px; color:#94a3b8; margin-top:4px;">ID: ${c.id}</div>
        </td>
        <td>
          <div class="count-controls">
            <button class="btn-mini" onclick="updateSent(${index},-1)">-</button>
            <span class="sent-count">${c.sent || 0}</span>
            <button class="btn-mini" onclick="updateSent(${index},1)">+</button>
          </div>
        </td>
        <td><span class="count-badge">${c.count}</span></td>
        <td class="url-cell" title="${trackingUrl}">${trackingUrl}</td>
        <td>
          <button class="btn btn-copy" onclick="copyText('${trackingUrl}')">コピー</button>
          <button class="btn btn-delete" onclick="deleteItem(${index})">削除</button>
        </td>
      `;
      body.appendChild(tr);
    });
  }

  function updateSent(i, d) { companies[i].sent = Math.max(0, (companies[i].sent||0)+d); saveData(); renderTable(); }
  function saveData() { localStorage.setItem(`track_data_${settings.clientId}`, JSON.stringify(companies)); }
  function deleteItem(i) { if(confirm('削除しますか？')){ companies.splice(i,1); saveData(); renderTable(); } }

  // 全削除ボタンの機能を実装
  function deleteAllCompanies() {
    if (confirm('【注意】リストをすべて削除します。よろしいですか？')) {
      companies = [];
      saveData();
      renderTable();
    }
  }

  function copyText(t) { navigator.clipboard.writeText(t).then(()=>alert('配信用URLをコピーしました')); }
  
  function downloadCSV() {
    if (!companies.length) return alert('データがありません');
    let csv = "\ufeff法人番号,会社名,HP,お問い合わせURL,送信数,クリック数\n";
    companies.forEach(c => {
      csv += `"${c.id}","${c.name}","${c.hpUrl}","${c.contactUrl}",${c.sent},${c.count}\n`;
    });
    const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const link = document.createElement("a");
    link.href = url;
    link.download = "tracking_list.csv";
    link.click();
  }

  init();
</script>
</body>
</html>
